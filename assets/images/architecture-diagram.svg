<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <linearGradient id="aBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0f1422"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1100" height="420" rx="14" fill="url(#aBg)"/>
  <rect x="1" y="1" width="1098" height="418" rx="13" fill="none" stroke="#1f2a40" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#eef1f8" letter-spacing="0.5">
    SYSTEM ARCHITECTURE &amp; AR PROCESSING PIPELINE
  </text>
  <text x="40" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8896b3">
    End-to-end real-time spatial computing running 100% locally in client WebAssembly and WebGL
  </text>

  <!-- Flow Line Background Connecting Stages -->
  <line x1="160" y1="210" x2="940" y2="210" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="210" x2="940" y2="210" stroke="url(#flowLine)" stroke-width="2.5" stroke-dasharray="8,6"/>

  <!-- Stage 1: Optical Acquisition -->
  <g transform="translate(40, 100)">
    <rect width="190" height="220" rx="12" fill="url(#cardGrad1)" stroke="#27354f" stroke-width="1.5"/>
    <circle cx="95" cy="40" r="22" fill="#0f2137" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="85" y="46" font-size="18">📹</text>

    <text x="95" y="85" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#eef1f8" text-anchor="middle">
      Video Stream
    </text>
    <text x="95" y="105" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">
      60 FPS Webcam
    </text>
    
    <g transform="translate(18, 125)" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">
      <text x="0" y="0">• navigator.mediaDevices</text>
      <text x="0" y="20">• Adaptive aspect ratio</text>
      <text x="0" y="40">• Zero server streaming</text>
      <text x="0" y="60">• Offline #demo engine</text>
    </g>
  </g>

  <!-- Stage 2: MediaPipe Tasks Vision -->
  <g transform="translate(260, 100)">
    <rect width="230" height="220" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <circle cx="115" cy="40" r="22" fill="#14263f" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="46" font-size="18">⚡</text>

    <text x="115" y="85" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#eef1f8" text-anchor="middle">
      MediaPipe AI Engine
    </text>
    <text x="115" y="105" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#7fd1ff" text-anchor="middle">
      WASM + TFLite Models
    </text>

    <g transform="translate(18, 125)" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">
      <text x="0" y="0">• Face Landmarker (478 pts)</text>
      <text x="0" y="20">• Hand Landmarker (21 joints)</text>
      <text x="0" y="40">• Sub-millimeter 3D depth</text>
      <text x="0" y="60">• Dynamic jaw delta angle</text>
    </g>
  </g>

  <!-- Stage 3: Spatial Fitting & Kinematics -->
  <g transform="translate(520, 100)">
    <rect width="230" height="220" rx="12" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="115" cy="40" r="22" fill="#29163b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="105" y="46" font-size="18">📐</text>

    <text x="115" y="85" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#eef1f8" text-anchor="middle">
      Kinematics &amp; Fitting
    </text>
    <text x="115" y="105" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">
      Rigid &amp; Skeletal Transform
    </text>

    <g transform="translate(18, 125)" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">
      <text x="0" y="0">• Procrustes point fitting</text>
      <text x="0" y="20">• TMJ jaw hinge rotation</text>
      <text x="0" y="40">• Bone segment interpolation</text>
      <text x="0" y="60">• Smoothing &amp; jitter filters</text>
    </g>
  </g>

  <!-- Stage 4: Three.js WebGL & Holographic Shaders -->
  <g transform="translate(780, 100)">
    <rect width="280" height="220" rx="12" fill="url(#cardGrad1)" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="140" cy="40" r="22" fill="#122a22" stroke="#34d399" stroke-width="1.5"/>
    <text x="130" y="46" font-size="18">✨</text>

    <text x="140" y="85" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#eef1f8" text-anchor="middle">
      Three.js WebGL Shaders
    </text>
    <text x="140" y="105" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">
      Custom GLSL Shaders &amp; HUD
    </text>

    <g transform="translate(22, 125)" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">
      <text x="0" y="0">• Volumetric X-Ray Fresnel Glow</text>
      <text x="0" y="20">• Solid anatomical tissue shader</text>
      <text x="0" y="40">• Multi-reveal: Split, Lens, Depth</text>
      <text x="0" y="60">• Real-time 3D billboard labels</text>
    </g>
  </g>

  <!-- Bottom Privacy & Performance Banner -->
  <g transform="translate(40, 345)">
    <rect width="1020" height="45" rx="8" fill="#090e1a" stroke="#1d273a" stroke-width="1"/>
    <circle cx="25" cy="22" r="5" fill="#34d399"/>
    <text x="40" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#eef1f8">
      <tspan font-weight="700" fill="#34d399">100% PRIVATE &amp; LOCAL:</tspan> All camera streams, vision inferences, and mesh renders happen strictly on device. Zero external data transmission.
    </text>
  </g>
</svg>
