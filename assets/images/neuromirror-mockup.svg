<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%">
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="70%" stop-color="#0a0e18"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#0f131f"/>
    </linearGradient>
    <radialGradient id="hologramSpot" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="0"/>
    </radialGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1100" height="640" rx="16" fill="url(#mBg)"/>
  <rect x="1" y="1" width="1098" height="638" rx="15" fill="none" stroke="#222c42" stroke-width="1.5"/>

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="1100" height="42" rx="16" fill="#121724"/>
  <rect x="0" y="26" width="1100" height="16" fill="#121724"/>
  <circle cx="24" cy="21" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="21" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="21" r="5" fill="#27c93f"/>
  <rect x="160" y="8" width="780" height="26" rx="6" fill="#090c13" stroke="#262d42" stroke-width="1"/>
  <text x="180" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#7fd1ff">
    🔒 https://atluri0001.github.io/NeuroMirror/
  </text>
  <text x="890" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#57d98a" font-weight="700">● 60 FPS • LIVE AR</text>

  <!-- Main Viewport Layout -->
  <!-- Left Side: Interactive 3D AR Stage -->
  <g transform="translate(30, 65)">
    <rect width="680" height="540" rx="14" fill="url(#stageGrad)" stroke="#262d42" stroke-width="1.5"/>
    <rect width="680" height="540" rx="14" fill="url(#hologramSpot)"/>

    <!-- Grid Lines on Stage -->
    <line x1="340" y1="0" x2="340" y2="540" stroke="#1d263b" stroke-width="1" stroke-dasharray="4,6"/>
    <line x1="0" y1="270" x2="680" y2="270" stroke="#1d263b" stroke-width="1" stroke-dasharray="4,6"/>

    <!-- Silhouette of User Head (Camera Input Underlay) -->
    <path d="M 230 450 C 230 380 270 340 270 300 C 260 260 260 200 270 170 C 285 120 315 90 340 90 C 365 90 395 120 410 170 C 420 200 420 260 410 300 C 410 340 450 380 450 450 Z" 
          fill="#111827" fill-opacity="0.45" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Holographic Skull Rendering (Three.js WebGL Simulation) -->
    <!-- Brain Cortex Highlight (Lobe View) -->
    <path d="M 290 170 C 280 125 310 105 340 105 C 370 105 400 125 390 170 C 405 180 405 210 395 225 C 385 240 375 235 365 230 C 355 245 325 245 315 230 C 305 235 295 240 285 225 C 275 210 275 180 290 170 Z" 
          fill="#c084fc" fill-opacity="0.22" stroke="#e879f9" stroke-width="2" filter="url(#mGlow)"/>

    <!-- Cranial Structure -->
    <path d="M 285 190 C 275 130 305 110 340 110 C 375 110 405 130 395 190 C 400 220 388 235 380 250 C 372 260 368 280 364 300 C 358 308 322 308 316 300 C 312 280 308 260 300 250 C 292 235 280 220 285 190 Z" 
          fill="none" stroke="#7fd1ff" stroke-width="2.5" filter="url(#mGlow)"/>

    <!-- Eye Sockets & Orbit Spheres -->
    <ellipse cx="315" cy="200" rx="15" ry="18" fill="#060c18" stroke="#7fd1ff" stroke-width="2"/>
    <ellipse cx="365" cy="200" rx="15" ry="18" fill="#060c18" stroke="#7fd1ff" stroke-width="2"/>
    <circle cx="315" cy="200" r="5" fill="#38bdf8"/>
    <circle cx="365" cy="200" r="5" fill="#38bdf8"/>

    <!-- Nasal Cavity -->
    <polygon points="340,218 346,236 334,236" fill="#060c18" stroke="#7fd1ff" stroke-width="1.8"/>

    <!-- Maxilla & Teeth Line -->
    <path d="M 320 256 Q 340 260 360 256" fill="none" stroke="#7fd1ff" stroke-width="2.2"/>
    <line x1="328" y1="254" x2="328" y2="259" stroke="#7fd1ff" stroke-width="1.5"/>
    <line x1="336" y1="255" x2="336" y2="260" stroke="#7fd1ff" stroke-width="1.5"/>
    <line x1="344" y1="255" x2="344" y2="260" stroke="#7fd1ff" stroke-width="1.5"/>
    <line x1="352" y1="254" x2="352" y2="259" stroke="#7fd1ff" stroke-width="1.5"/>

    <!-- Dynamic Jaw / Mandible with Kinematics Pivot -->
    <path d="M 312 265 C 314 285 320 302 340 304 C 360 302 366 285 368 265" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
    <!-- TMJ Dynamic Pivot -->
    <circle cx="310" cy="260" r="4" fill="#ff5d73"/>
    <circle cx="370" cy="260" r="4" fill="#ff5d73"/>

    <!-- Left Hand Skeletal Tracking in 3D -->
    <g transform="translate(180, 310)">
      <circle cx="0" cy="40" r="6" fill="#a855f7" filter="url(#mGlow)"/>
      <line x1="0" y1="40" x2="-25" y2="5" stroke="#d9f0ff" stroke-width="2.5"/>
      <line x1="-25" y1="5" x2="-35" y2="-20" stroke="#d9f0ff" stroke-width="2"/>
      <line x1="0" y1="40" x2="-8" y2="-5" stroke="#d9f0ff" stroke-width="2.5"/>
      <line x1="-8" y1="-5" x2="-12" y2="-35" stroke="#d9f0ff" stroke-width="2"/>
      <line x1="0" y1="40" x2="10" y2="-5" stroke="#d9f0ff" stroke-width="2.5"/>
      <line x1="10" y1="-5" x2="14" y2="-38" stroke="#d9f0ff" stroke-width="2"/>
      <line x1="0" y1="40" x2="28" y2="2" stroke="#d9f0ff" stroke-width="2.5"/>
      <line x1="28" y1="2" x2="35" y2="-28" stroke="#d9f0ff" stroke-width="2"/>
      <line x1="0" y1="40" x2="42" y2="20" stroke="#d9f0ff" stroke-width="2.5"/>
      <line x1="42" y1="20" x2="52" y2="0" stroke="#d9f0ff" stroke-width="2"/>

      <!-- Joints -->
      <circle cx="-35" cy="-20" r="3" fill="#7fd1ff"/>
      <circle cx="-12" cy="-35" r="3" fill="#7fd1ff"/>
      <circle cx="14" cy="-38" r="3" fill="#7fd1ff"/>
      <circle cx="35" cy="-28" r="3" fill="#7fd1ff"/>
      <circle cx="52" cy="0" r="3" fill="#7fd1ff"/>
      <text x="-40" y="65" font-family="-apple-system, sans-serif" font-size="10" fill="#7fd1ff" font-weight="700">HAND BONES (21 PTS)</text>
    </g>

    <!-- Interactive Dynamic Labels on Stage -->
    <!-- Label: Frontal Bone -->
    <g transform="translate(415, 120)">
      <line x1="-25" y1="15" x2="20" y2="15" stroke="#7fd1ff" stroke-width="1.2"/>
      <circle cx="-25" cy="15" r="3" fill="#7fd1ff"/>
      <rect x="20" y="4" width="95" height="22" rx="4" fill="#141c2c" stroke="#7fd1ff" stroke-width="1"/>
      <text x="28" y="19" font-family="-apple-system, sans-serif" font-size="10" fill="#e2e8f0" font-weight="600">Frontal bone</text>
    </g>
    <!-- Label: Cerebral Cortex -->
    <g transform="translate(185, 150)">
      <line x1="80" y1="15" x2="20" y2="15" stroke="#f472b6" stroke-width="1.2"/>
      <circle cx="80" cy="15" r="3" fill="#f472b6"/>
      <rect x="-80" y="4" width="95" height="22" rx="4" fill="#241426" stroke="#f472b6" stroke-width="1"/>
      <text x="-72" y="19" font-family="-apple-system, sans-serif" font-size="10" fill="#f472b6" font-weight="600">Brain (Cortex)</text>
    </g>
    <!-- Label: Mandible (Jaw) -->
    <g transform="translate(420, 290)">
      <line x1="-50" y1="15" x2="10" y2="15" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="-50" cy="15" r="3" fill="#38bdf8"/>
      <rect x="10" y="4" width="110" height="22" rx="4" fill="#0e1f30" stroke="#38bdf8" stroke-width="1"/>
      <text x="18" y="19" font-family="-apple-system, sans-serif" font-size="10" fill="#7fd1ff" font-weight="600">Mandible (Jaw)</text>
    </g>

    <!-- Stage HUD Bottom Bar -->
    <rect x="15" y="490" width="650" height="35" rx="8" fill="#090d16" fill-opacity="0.85" stroke="#1d263b" stroke-width="1"/>
    <text x="30" y="512" font-family="monospace" font-size="11" fill="#7fd1ff">POSE: X: 0.0cm  Y: +1.2cm  Z: -3.8cm  |  YAW: -2.4°  PITCH: +1.1°  ROLL: 0.0°</text>
  </g>

  <!-- Right Side: Control Panels Aside -->
  <g transform="translate(730, 65)">
    <!-- Header -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#eef1f8">
      Controls &amp; Layers
    </text>

    <!-- Status Panel -->
    <g transform="translate(0, 38)">
      <rect width="340" height="36" rx="8" fill="url(#panelGrad)" stroke="#262d42" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#57d98a"/>
      <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#57d98a">
        Camera tracking active • 60 FPS
      </text>
    </g>

    <!-- Layers Panel -->
    <g transform="translate(0, 86)">
      <rect width="340" height="150" rx="10" fill="url(#panelGrad)" stroke="#262d42" stroke-width="1"/>
      <text x="16" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#8b95b2" letter-spacing="1">
        ANATOMICAL LAYERS
      </text>
      
      <!-- Presets -->
      <g transform="translate(16, 32)">
        <rect width="68" height="24" rx="6" fill="#7fd1ff"/>
        <text x="18" y="16" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#06121c">Skull</text>

        <rect x="74" y="0" width="68" height="24" rx="6" fill="#0b0f18" stroke="#262d42" stroke-width="1"/>
        <text x="92" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#eef1f8">Brain</text>

        <rect x="148" y="0" width="76" height="24" rx="6" fill="#0b0f18" stroke="#262d42" stroke-width="1"/>
        <text x="160" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#eef1f8">Muscles</text>

        <rect x="230" y="0" width="76" height="24" rx="6" fill="#0b0f18" stroke="#262d42" stroke-width="1"/>
        <text x="245" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#eef1f8">All</text>
      </g>

      <!-- Checkboxes Grid -->
      <g transform="translate(16, 75)" font-family="-apple-system, sans-serif" font-size="12" fill="#eef1f8">
        <!-- Col 1 -->
        <circle cx="8" cy="8" r="5" fill="#7fd1ff"/>
        <text x="20" y="12">☑ Skull (Cranium)</text>

        <circle cx="8" cy="34" r="5" fill="#ff9fc0"/>
        <text x="20" y="38">☑ Brain (Cortex)</text>

        <circle cx="8" cy="60" r="5" fill="#ff6b5e"/>
        <text x="20" y="64">☑ Facial Muscles</text>

        <!-- Col 2 -->
        <circle cx="160" cy="8" r="5" fill="#fff3a8"/>
        <text x="172" y="12">☑ Eyes (Orbits)</text>

        <circle cx="160" cy="34" r="5" fill="#6fb6ff"/>
        <text x="172" y="38">☑ Head Outline</text>

        <circle cx="160" cy="60" r="5" fill="#d9f0ff"/>
        <text x="172" y="64">☑ Hand Bones</text>
      </g>
    </g>

    <!-- Look & Shader Style Panel -->
    <g transform="translate(0, 248)">
      <rect width="340" height="96" rx="10" fill="url(#panelGrad)" stroke="#262d42" stroke-width="1"/>
      <text x="16" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#8b95b2" letter-spacing="1">
        SHADER &amp; RENDER STYLE
      </text>

      <g transform="translate(16, 34)">
        <rect width="145" height="32" rx="7" fill="#7fd1ff"/>
        <text x="32" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#06121c">✨ X-Ray Glow</text>

        <rect x="155" y="0" width="145" height="32" rx="7" fill="#0b0f18" stroke="#262d42" stroke-width="1"/>
        <text x="180" y="20" font-family="-apple-system, sans-serif" font-size="12" fill="#eef1f8">🥩 Solid Anatomy</text>
      </g>
      <text x="16" y="85" font-family="-apple-system, sans-serif" font-size="11" fill="#8b95b2">Show 3D anatomical labels: ☑ ON</text>
    </g>

    <!-- Reveal Modes Panel -->
    <g transform="translate(0, 356)">
      <rect width="340" height="120" rx="10" fill="url(#panelGrad)" stroke="#262d42" stroke-width="1"/>
      <text x="16" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#8b95b2" letter-spacing="1">
        REVEAL &amp; BLEND MODES
      </text>

      <g transform="translate(16, 38)" font-family="-apple-system, sans-serif" font-size="12">
        <text x="0" y="16" fill="#eef1f8">Mode:</text>
        <rect x="55" y="0" width="245" height="26" rx="6" fill="#0b0f18" stroke="#262d42" stroke-width="1"/>
        <text x="68" y="17" fill="#7fd1ff">Lens (Interactive AR Flashlight) ▼</text>
      </g>

      <!-- Sliders Mockup -->
      <g transform="translate(16, 80)">
        <text x="0" y="12" font-family="-apple-system, sans-serif" font-size="11" fill="#8b95b2">Realism Blend:</text>
        <rect x="110" y="6" width="140" height="6" rx="3" fill="#262d42"/>
        <rect x="110" y="6" width="60" height="6" rx="3" fill="#7fd1ff"/>
        <circle cx="170" cy="9" r="6" fill="#7fd1ff"/>
        <text x="260" y="12" font-family="monospace" font-size="11" fill="#7fd1ff">42%</text>
      </g>
    </g>

    <!-- Calibration Info -->
    <g transform="translate(0, 488)">
      <rect width="340" height="52" rx="10" fill="#0b101c" stroke="#1d263b" stroke-width="1"/>
      <text x="16" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">
        Auto-Calibrated to 478 Facial Anchors
      </text>
      <text x="16" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">
        Sub-millimeter tracking with jaw hinge kinematic matching
      </text>
    </g>
  </g>
</svg>
